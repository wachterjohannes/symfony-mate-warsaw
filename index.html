<header>Road to here · Amsterdam, November 2025</header>

<h1 id="it-started-in-a-hallway">It started in a hallway.</h1>
<div class="cards">
<div class="card">
<h3 id="fabiens-keynote">Fabien's keynote</h3>
<p>Symfony's data is tedious for humans and gold for a model. I saw a role for myself.</p>
</div>
<div class="card">
<h3 id="tobias-nyholm">Tobias Nyholm</h3>
<p>The first time I said it out loud: let an agent see what a Symfony app is doing.</p>
</div>
<div class="card">
<h3 id="christopher-hertel">Christopher Hertel</h3>
<p>A conversation about modelflow-ai and symfony/ai. Then a small PR on day two, without asking.</p>
</div>
</div>
<div class="note">
<p>The prototype fit in a train ride. First test offline, through Switzerland, with a local model.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="Road to here" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="5" style="--paginate:true;--header:Road to here;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">

<img src="assets/illustrations/mate-timeline.svg" style="left:50px;top:255px;width:1180px" />
<div class="note">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="What Mate does" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="6" style="--paginate:true;--header:What Mate does;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>What Mate does</header>

<h1 id="what-happens-when-ai-has-to-guess">What happens when AI has to guess?</h1>
<p><strong>You:</strong> &quot;I filled out the signup form, hit save, and the page just reloaded. What went wrong?&quot;</p>
<img src="assets/illustrations/ai-blind-search.svg" style="left:50px;top:290px;width:1180px" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="What Mate does" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="7" style="--paginate:true;--header:What Mate does;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>What Mate does</header>

<h1 id="why-guessing-doesnt-scale">Why guessing doesn't scale.</h1>
<table>
<thead>
<tr>
<th></th>
<th>Guessing</th>
<th>One targeted call</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Approach</strong></td>
<td>Read 10+ files, grep, infer</td>
<td>Ask the app what happened</td>
</tr>
<tr>
<td><strong>Answer</strong></td>
<td>A list of suspects</td>
<td>The recorded fact</td>
</tr>
<tr>
<td><strong>Reliability</strong></td>
<td>Different answer every run</td>
<td>Same answer every run</td>
</tr>
<tr>
<td><strong>Improvable</strong></td>
<td>Hardly</td>
<td>Yes, you shape the output</td>
</tr>
</tbody>
</table>
<div class="note">
<p>That is what Mate does: it hands the agent what Symfony already knows. Profiler, logs, container, environment.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="What Mate does" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="8" style="--paginate:true;--header:What Mate does;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>What Mate does</header>

<h1 id="mate-in-one-slide">Mate in one slide.</h1>
<pre><code class="language-bash">composer require --dev symfony/ai-mate symfony/ai-symfony-mate-extension
vendor/bin/mate init                     <span class="hljs-comment"># AGENTS.md block, skills</span>
vendor/bin/mate tools:list               <span class="hljs-comment"># what the agent runs from here on</span>
vendor/bin/mate tools:call symfony-profiler-list --<span class="hljs-built_in">limit</span>=1
vendor/bin/mate resources:<span class="hljs-built_in">read</span> symfony-profiler://profile/&lt;token&gt;
</code></pre>
<img src="assets/illustrations/mate-architecture.svg" style="left:50px;top:440px;width:1180px" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-class="center" data-footer="Same app twice. Same prompt. Same model: Haiku." data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" class="center" data-marpit-pagination="9" style="--paginate:true;--class:center;--footer:Same app twice. Same prompt. Same model: Haiku.;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">

<footer>Same app twice. Same prompt. Same model: Haiku.</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="Live Demo · 1 of 2" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="10" style="--paginate:true;--header:Live Demo · 1 of 2;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>Live Demo · 1 of 2</header>

<h1 id="without-mate">Without Mate.</h1>
<ul>
<li>The code knows what <em>can</em> fail: email, username, password, terms</li>
<li>Only the app knows what <em>did</em> fail. The log has the POST, not the field.</li>
<li>Watch the first command. Then: does the answer name the field?</li>
</ul>
<div class="note">
<p>Terminal A: <code>demo/run/ask.sh plain</code></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="Live Demo · 2 of 2" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="11" style="--paginate:true;--header:Live Demo · 2 of 2;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>Live Demo · 2 of 2</header>

<h1 id="with-mate">With Mate.</h1>
<ul>
<li>Same app, same prompt, same model. One has Mate installed.</li>
<li>The first command goes to Mate: list profiles, open the POST with 422, read the form collector</li>
<li>The answer names the field and the value</li>
</ul>
<div class="note">
<p>Terminal B: <code>demo/run/ask.sh mate</code></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="Live Demo · replay 1 of 2" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="12" style="--paginate:true;--header:Live Demo · replay 1 of 2;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>Live Demo · replay 1 of 2</header>

<h1 id="without-mate-step-by-step">Without Mate, step by step.</h1>
<div class="replay">
<div class="step">
<pre><code class="language-text">&gt; I just filled out the signup form in my browser
  and hit save, but the page just reloaded and the
  account wasn&#x27;t created. What went wrong? Be brief.
</code></pre>
<div></div>
</div>
<div class="fragment" data-marpit-fragment>
<pre><code class="language-text">0:01 ● ls -la &amp;&amp; find . -type f …
0:03 ● cat src/Controller/*.php; cat src/Form/*.php
</code></pre>
<div>
<h3 id="001--first-move">0:01 · first move</h3>
<p>Lists the files. Then reads every controller and form class.</p>
</div>
</div>
<div class="fragment" data-marpit-fragment>
<pre><code class="language-text">0:04 ● cat templates/signup.html.twig;
       cat config/packages/*.yaml; tail var/log/*.log
</code></pre>
<div>
<h3 id="004--the-suspects">0:04 · the suspects</h3>
<p>Template, config, the log tail. Four rules that <em>can</em> fail.</p>
</div>
</div>
<div class="fragment" data-marpit-fragment>
<pre><code class="language-text">0:09 ● The account wasn&#x27;t created because the form
       failed validation, and the template never
       shows the errors. Likely failing rules:
       username 3–16 lowercase …, password ≥ 12,
       email valid, terms ticked. I haven&#x27;t changed
       anything. Want me to add form_errors?
</code></pre>
<div>
<h3 id="009--verdict">0:09 · verdict</h3>
<p>&quot;The form failed validation.&quot; Which rule? It cannot know. A guess, and an offer to render the errors.</p>
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="Live Demo · replay 2 of 2" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="13" style="--paginate:true;--header:Live Demo · replay 2 of 2;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>Live Demo · replay 2 of 2</header>

<h1 id="with-mate-step-by-step">With Mate, step by step.</h1>
<div class="replay">
<div class="step">
<pre><code class="language-text">&gt; (the same prompt)
</code></pre>
<div></div>
</div>
<div class="fragment" data-marpit-fragment>
<pre><code class="language-text">0:01 ● vendor/bin/mate tools:list
</code></pre>
<div>
<h3 id="001--first-move-1">0:01 · first move</h3>
<p>No file opened. Asks Mate what it can do.</p>
</div>
</div>
<div class="fragment" data-marpit-fragment>
<pre><code class="language-text">0:03 ● vendor/bin/mate tools:call symfony-profiler-list
         --limit=5 --method=POST
0:03 ● vendor/bin/mate tools:call monolog-tail
         --limit=30
0:04   The POST profile returned 422, so the form was
       rejected by validation.
</code></pre>
<div>
<h3 id="003--asks">0:03 · asks</h3>
<p>Lists the POST profiles: /signup, 422, one token.</p>
</div>
</div>
<div class="fragment" data-marpit-fragment>
<pre><code class="language-text">0:05 ● vendor/bin/mate resources:read
         symfony-profiler://profile/3d1185/form
</code></pre>
<div>
<h3 id="005--fact">0:05 · fact</h3>
<p>Reads the form collector. Field, value, the violated rule.</p>
</div>
</div>
<div class="fragment" data-marpit-fragment>
<pre><code class="language-text">0:08 ● One violation, field username: `Johannes_W`
       failed /^[a-z0-9_]+$/ (&quot;Only lowercase
       letters, digits and underscores.&quot;) The
       uppercase J and W are the cause.
</code></pre>
<div>
<h3 id="008--verdict">0:08 · verdict</h3>
<p>Johannes_W, uppercase J and W. Same model, one fact.</p>
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="Live Demo" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="14" style="--paginate:true;--header:Live Demo;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>Live Demo</header>

<h1 id="what-you-just-saw">What you just saw.</h1>
<div class="cards">
<div class="card">
<h3 id="without-mate-1">Without Mate</h3>
<p>Reads the code, lists suspects. Honest, but a guess.</p>
</div>
<div class="card">
<h3 id="with-mate-1">With Mate</h3>
<p>First call goes to Mate, then to the profiler. Names the field and the value.</p>
</div>
<div class="card">
<h3 id="why">Why</h3>
<p>Not a smarter model. The fact exists only at runtime, and one line tells the agent to look there first.</p>
</div>
</div>
<div class="note">
<p>The difference is the data, not the model.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="Under the hood" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="15" style="--paginate:true;--header:Under the hood;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>Under the hood</header>

<h1 id="three-decisions-that-still-hold">Three decisions that still hold.</h1>
<div class="columns">
<div>
<pre><code class="language-php"><span class="hljs-keyword">use</span> <span class="hljs-title">Symfony</span>\<span class="hljs-title">AI</span>\<span class="hljs-title">Mate</span>\<span class="hljs-title">Attribute</span>\<span class="hljs-title">MateTool</span>;

<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">MigrationStatus</span>
</span>{
    <span class="hljs-meta">#[MateTool</span>(<span class="hljs-attr">name</span>: <span class="hljs-string">&#x27;migration-status&#x27;</span>,
        <span class="hljs-attr">description</span>: <span class="hljs-string">&#x27;Migration files on disk&#x27;</span>)<span class="hljs-meta">]</span>
    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">check</span>(<span class="hljs-params"><span class="hljs-keyword">string</span> <span class="hljs-variable">$projectDir</span></span>): <span class="hljs-title">array</span>
    </span>{
        <span class="hljs-variable">$files</span> = <span class="hljs-title function_ invoke__">glob</span>(<span class="hljs-string">&quot;<span class="hljs-subst">$projectDir</span>/migrations/*.php&quot;</span>);

        <span class="hljs-keyword">return</span> [<span class="hljs-string">&#x27;total&#x27;</span> =&gt; <span class="hljs-title function_ invoke__">count</span>(<span class="hljs-variable">$files</span>),
                <span class="hljs-string">&#x27;latest&#x27;</span> =&gt; <span class="hljs-title function_ invoke__">basename</span>(<span class="hljs-title function_ invoke__">end</span>(<span class="hljs-variable">$files</span>))];
    }
}
</code></pre>
</div>
<div>
<h3 id="own-container">Own container</h3>
<p>Built from <code>mate/config.php</code>. Your app is never booted.</p>
<h3 id="extensions-are-composer-packages">Extensions are Composer packages</h3>
<p><code>extra.ai-mate</code> in composer.json. <code>mate discover</code> registers them, writes instructions, installs skills.</p>
<h3 id="tool-output-is-data">Tool output is data</h3>
<p>Marked untrusted. Known secrets redacted, best effort.</p>
</div>
</div>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="Kill the MCP" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="18" style="--paginate:true;--header:Kill the MCP;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>Kill the MCP</header>

<h1 id="the-premise-was-mcp-was-it-still-true">The premise was MCP. Was it still true?</h1>
<ul>
<li>Mate was born as an MCP server. I picked it early and never re-examined it.</li>
<li>Its clients already have a shell</li>
<li>The server was a second lifecycle: a process, a config, a handshake</li>
<li>So: prototype Mate without it, and measure what gets lost</li>
</ul>
<p><img src="assets/illustrations/question-mark.svg" alt="" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="The Mate Lab" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="19" style="--paginate:true;--header:The Mate Lab;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>The Mate Lab</header>

<h1 id="one-question-does-the-agent-touch-the-tool">One question: does the agent touch the tool?</h1>
<ul>
<li>Two small tasks, each with a planted bug</li>
<li>A fresh copy of the app for every run</li>
<li>Several runs per setup</li>
<li>Claude Haiku: a small model explores less</li>
<li>Measured: does the agent use Mate at all?</li>
</ul>
<p><img src="assets/illustrations/bug.svg" alt="" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="The Mate Lab" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="20" style="--paginate:true;--header:The Mate Lab;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">

<h1 id="skills-are-the-discovery-layer">Skills are the discovery layer.</h1>
<p>The fix was already in the repo. I had built it for something else.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="Skills" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="23" style="--paginate:true;--header:Skills;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>Skills</header>

<h1 id="what-a-skill-is">What a skill is.</h1>
<div class="columns">
<div>
<pre><code class="language-markdown">---
name: symfony-profiler-debugging
description: Investigate requests, exceptions
<span class="hljs-section">  and performance with the Symfony Profiler
---</span>
Open the Profiler before guessing
at the cause of a misbehaving request.
...
</code></pre>
</div>
<div>
<h3 id="three-tiers-paid-on-demand">Three tiers, paid on demand</h3>
<ul>
<li>The description is always in context. Cheap. A triage signal.</li>
<li>The body loads when the task matches.</li>
<li><code>references/</code> loads only when the agent needs depth.</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="Skills" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="24" style="--paginate:true;--header:Skills;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>Skills</header>

<h1 id="the-last-mile">The last mile.</h1>
<table>
<thead>
<tr>
<th>Agent</th>
<th>Reads skills from</th>
</tr>
</thead>
<tbody>
<tr>
<td>Claude Code</td>
<td><code>.claude/skills/</code></td>
</tr>
<tr>
<td>Codex, OpenCode, Copilot</td>
<td><code>.agents/skills/</code></td>
</tr>
<tr>
<td>Any agent, over MCP</td>
<td>nobody, yet</td>
</tr>
</tbody>
</table>
<ul>
<li>A package declares its skills in <code>composer.json</code>. <code>mate skills:install</code> copies them into your repo.</li>
<li>Installed safely: the copy is yours. Review every change in the diff, overwrite a skill that does not fit.</li>
<li>Built as a polyfill, until agents read skills over MCP.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="The Mate Lab" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="25" style="--paginate:true;--header:The Mate Lab;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>The Mate Lab</header>

<h1 id="second-result-cli-plus-skills">Second result: CLI plus skills.</h1>
<img src="assets/illustrations/mate-lab-usage.svg" style="left:50px;top:230px;width:1180px" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="Mate today" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="26" style="--paginate:true;--header:Mate today;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>Mate today</header>

<h1 id="mcp-out-cli-in-symfony-ai-013">MCP out, CLI in. Symfony AI 0.13.</h1>
<div class="columns">
<div>
<h3 id="before-mcp-server">Before: MCP server</h3>
<ul>
<li>A process to start, a handshake</li>
<li>One config file per client</li>
<li>Every tool description in context, always</li>
<li>Discovery by the protocol</li>
</ul>
</div>
<div>
<h3 id="after-cli">After: CLI</h3>
<ul>
<li>Commands the agent calls directly</li>
<li>One <code>AGENTS.md</code> block, any client</li>
<li>Only short descriptions in context</li>
<li>Discovery by skills</li>
</ul>
</div>
</div>
<div class="note">
<p>Same tools, same schemas, same knowledge. Only the transport changed.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-class="center quote" data-footer="Symfony AI 0.13, my first release as a core team member" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" class="center quote" data-marpit-pagination="27" style="--paginate:true;--class:center quote;--footer:Symfony AI 0.13, my first release as a core team member;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<blockquote>
<p>The hardest code to delete is your own.</p>
</blockquote>
<footer>Symfony AI 0.13, my first release as a core team member</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-class="statement" data-header="Beyond Mate" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" class="statement" data-marpit-pagination="28" style="--paginate:true;--class:statement;--header:Beyond Mate;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>Beyond Mate</header>

<h1 id="settled-now-the-ideas-travel">Settled. Now the ideas travel.</h1>
<p>Mate is settled. The ideas belong in every package.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="MakerBundle" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="29" style="--paginate:true;--header:MakerBundle;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>MakerBundle</header>

<h1 id="the-makerbundle-was-not-agent-ready">The MakerBundle was not agent-ready.</h1>
<div class="cards">
<div class="card">
<h3 id="before">Before</h3>
<p>Every maker asks questions. An agent cannot answer a prompt, so it gets stuck or guesses.</p>
</div>
<div class="card">
<h3 id="change">Change</h3>
<p>With Jérôme Tamarelle: every question became an option. Every maker runs non-interactively.</p>
</div>
<div class="card">
<h3 id="plus">Plus</h3>
<p>The idea with Kevin Bond: skills that tell the agent which maker to use. The rebuilt makers made them possible.</p>
</div>
</div>
<div class="note">
<p>Built with agents, tested with agents. Because that is how you build now.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="Symfony Skills" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="30" style="--paginate:true;--header:Symfony Skills;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>Symfony Skills</header>

<h1 id="symfony-skills-a-prototype">Symfony Skills, a prototype.</h1>
<div class="columns">
<div>
<h3 id="background-knowledge-six-skills">Background knowledge, six skills</h3>
<ul>
<li><code>components</code>: a Symfony component before hand-rolled infrastructure</li>
<li><code>services</code>: autowiring first, attributes for the rest</li>
<li><code>configuration</code>, <code>discover</code>, <code>templates</code>, <code>cli-conventions</code></li>
</ul>
<h3 id="maker-wrappers-18-skills">Maker wrappers, 18 skills</h3>
<ul>
<li><code>make-entity</code> to <code>make-ci</code>: which maker, which options. No PHP templates, the maker has them.</li>
</ul>
<h3 id="a-benchmark">A benchmark</h3>
<ul>
<li>The next change is measured, not felt.</li>
</ul>
</div>
<div style="text-align:center;padding-top:10px">
<img src="assets/qr-symfony-skills.svg" style="position:static;width:300px;height:300px;display:inline-block;border:12px solid #fff;box-sizing:border-box;border-radius:10px" />
<p style="margin:16px 0 0;font-family:var(--font-mono);font-size:18px;color:var(--grey-dark)">github.com/wachterjohannes/<br />symfony-skills</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="What travels" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="31" style="--paginate:true;--header:What travels;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>What travels</header>

<h1 id="code-configuration-and-now-knowledge">Code, configuration, and now knowledge.</h1>
<div class="cards">
<div class="card">
<h3 id="code">Code</h3>
<p>Composer. Since 2012. Nobody copies a library into <code>vendor/</code> by hand any more.</p>
</div>
<div class="card">
<h3 id="configuration">Configuration</h3>
<p>Flex recipes. Since 2017. A package brings its own config, you don't write it.</p>
</div>
<div class="card">
<h3 id="knowledge">Knowledge</h3>
<p>Skills. Starting now. A package brings what the agent needs to know about it, you don't write it.</p>
</div>
</div>
<div class="note">
<p>A skill on your filesystem helps your project. A skill shipped in a package helps every project that installs it.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="center quote" data-footer="Michał Pysiak, PrestaShop Summit Lyon, November 2026" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" class="center quote" data-marpit-pagination="32" style="--paginate:true;--class:center quote;--footer:Michał Pysiak, PrestaShop Summit Lyon, November 2026;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<blockquote>
<p>The model is replaceable. The harness is yours.</p>
</blockquote>
<footer>Michał Pysiak, PrestaShop Summit Lyon, November 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="Limits" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="33" style="--paginate:true;--header:Limits;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>Limits</header>

<h1 id="what-is-still-open">What is still open.</h1>
<ul>
<li><strong>Install:</strong> a Flex recipe should replace the Composer plugin</li>
<li><strong>Prompting:</strong> one line in AGENTS.md decides if the agent calls Mate</li>
<li><strong>Trust:</strong> Mate returns user input too. It is marked untrusted.</li>
<li><strong>Scope:</strong> dev and staging. No profiler data, no answer.</li>
</ul>
<p><img src="assets/illustrations/swiss-knife.svg" alt="" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="Outlook" data-theme="17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6" lang="de-AT" data-marpit-pagination="34" style="--paginate:true;--header:Outlook;--theme:17zirz6idy6ke6rww2vxy3un6yncrkm95rylpkruxr6;" data-marpit-pagination-total="37">
<header>Outlook</header>

<h1 id="where-you-come-in">Where you come in.</h1>
<ul>
<li><strong>Try:</strong> the Symfony Skills prototype, maybe at the hackathon tomorrow</li>
<li><strong>Ship:</strong> a skill with your bundle, an extension with your product</li>
<li><strong>Tell me:</strong> where Mate still guesses</li>
</ul>
